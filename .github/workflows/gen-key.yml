name: Generate HW keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate HW keystore
        run: |
          keytool -genkeypair -v \
            -keystore HW.jks \
            -alias HW \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass HW2026 -keypass HW2026 \
            -dname "CN=HW, OU=HW, O=HW, L=HW, ST=HW, C=EG"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: HW-keystore
          path: HW.jks
          retention-days: 1
