name: Build Weather APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# Real AdMob IDs can be supplied as Secrets. Until then the official Google
# test IDs are used, so the build always works.
env:
  ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
  ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID || 'ca-app-pub-3940256099942544/6300978111' }}
  ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID || 'ca-app-pub-3940256099942544/1033173712' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build signed sideload APK
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if ./gradlew assembleSideloadRelease --no-daemon; then
              exit 0
            fi
          done
          exit 1

      - name: Build signed Play AAB
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            echo "AAB build attempt $attempt of 3"
            if ./gradlew bundlePlayRelease --no-daemon; then
              exit 0
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-app
          path: 'android/app/build/outputs/apk/sideload/release/weather app.apk'
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-aab
          path: 'android/app/build/outputs/bundle/playRelease/*.aab'
          retention-days: 30

      # The app checks /releases/latest, so every sideload build must publish the APK.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/sideload/release/weather app.apk"
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -n 1)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#weather app.apk" --clobber
          else
            gh release create "$TAG" "$APK#weather app.apk" \
              --title "Weather App $TAG" \
              --notes "Signed sideload APK. Installs over the previous version." \
              --target "$GITHUB_SHA"
          fi

      # Secrets are not available in step-level `if`, so expose a flag first.
      - name: Check Play service account
        id: play_secret
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to Google Play (internal, draft)
        if: steps.play_secret.outputs.available == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hishamwahba.weatherapp
          releaseFiles: android/app/build/outputs/bundle/playRelease/*.aab
          track: internal
          status: draft
