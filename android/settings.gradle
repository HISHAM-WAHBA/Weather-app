pluginManagement {
    repositories {
        google()
        // repo.maven.apache.org rate-limits shared GitHub runner IPs (HTTP 404 +
        // retry-after). repo1.maven.org is the same Maven Central content on a
        // different hostname and is not affected.
        maven { url 'https://repo1.maven.org/maven2' }
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://repo1.maven.org/maven2' }
    }
}

rootProject.name = "WeatherApp"
include(":app")
