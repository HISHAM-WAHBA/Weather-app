plugins {
    id 'com.android.application'
}

// AdMob IDs can be overridden from CI (GitHub Secrets) without changing code.
// The official Google test IDs are the safe defaults.
def admobAppId = (project.findProperty('admobAppId') ?: System.getenv('ADMOB_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713').toString()
def admobBannerId = (project.findProperty('admobBannerId') ?: System.getenv('ADMOB_BANNER_ID') ?: 'ca-app-pub-3940256099942544/6300978111').toString()
def admobInterstitialId = (project.findProperty('admobInterstitialId') ?: System.getenv('ADMOB_INTERSTITIAL_ID') ?: 'ca-app-pub-3940256099942544/1033173712').toString()

// Ads are OFF until real AdMob IDs + a payment method are ready.
// Flip this back on with GitHub Secret ENABLE_ADS=true (or -PenableAds=true)
// together with the three real IDs — no code change needed.
def adsEnabled = (project.findProperty('enableAds') ?: System.getenv('ENABLE_ADS') ?: 'false').toString().toBoolean()

android {
    namespace 'com.hishamwahba.weatherapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hishamwahba.weatherapp'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '1.7'

        manifestPlaceholders = [admobAppId: admobAppId]
        buildConfigField 'boolean', 'ENABLE_ADS', String.valueOf(adsEnabled)
        buildConfigField 'String', 'ADMOB_BANNER_ID', '"' + admobBannerId + '"'
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '"' + admobInterstitialId + '"'
    }

    // sideload: GitHub self-update stays on (browser download link).
    // play:      self-update off — Play policy forbids updating outside the store.
    flavorDimensions 'distribution'
    productFlavors {
        sideload {
            dimension 'distribution'
            buildConfigField 'boolean', 'ENABLE_SELF_UPDATE', 'true'
        }
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'ENABLE_SELF_UPDATE', 'false'
        }
    }

    // Stable signing key (alias HW) so future updates install over this one.
    signingConfigs {
        release {
            storeFile file('HW.jks')
            storePassword 'HW2026'
            keyAlias 'HW'
            keyPassword 'HW2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Output file name includes the version, e.g. "weather-app-v1.7.apk" — no "debug"/"release".
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "weather-app-v${variant.versionName}.apk"
        }
    }

    // Needed for BuildConfig.VERSION_NAME / feature flags used by the app.
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Daily 7 AM / 10 PM weather notifications use the framework AlarmManager,
    // so no background-work library is needed here.
    // AdMob + UMP are kept for an easy re-enable (ENABLE_ADS=true), but
    // MainActivity never initializes them when BuildConfig.ENABLE_ADS is false.
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'
}
