plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hishamwahba.weatherapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hishamwahba.weatherapp'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // Stable signing key (alias HW) so future updates install over this one.
    signingConfigs {
        release {
            storeFile file('HW.jks')
            storePassword 'HW2026'
            keyAlias 'HW'
            keyPassword 'HW2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Output file name: "weather app.apk" — no "debug"/"release" in the name.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = 'weather app.apk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider shares the downloaded APK with the system installer.
    implementation 'androidx.core:core:1.13.1'
}
